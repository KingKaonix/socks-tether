name: Build and Release Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine version
        id: version
        run: |
          # Get latest tag or start at 1.0-alpha
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v1.0-alpha")
          echo "Latest tag: $LATEST"
          
          # Parse version and increment
          if echo "$LATEST" | grep -q "alpha\." ; then
            # Increment patch: v1.0-alpha.1 -> v1.0-alpha.2
            BASE=$(echo "$LATEST" | sed 's/\.[0-9]*$//')
            NUM=$(echo "$LATEST" | grep -o '[0-9]*$')
            NUM=$((NUM + 1))
            VERSION="${BASE}.${NUM}"
          elif [ "$LATEST" = "v1.0-alpha" ]; then
            VERSION="v1.0-alpha.1"
          else
            VERSION="v1.0-alpha"
          fi
          echo "New version: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Clone badvpn (tun2socks source)
        run: |
          cd app/src/main/cpp
          git clone --depth 1 https://github.com/ambrop72/badvpn.git badvpn

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: 8.4

      - name: Build APK
        run: gradle assembleDebug

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          files: app/build/outputs/apk/debug/app-debug.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
